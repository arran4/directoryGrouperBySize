project_name: directoryGrouperBySize
before:
  hooks:
    - go install github.com/cpuguy83/go-md2man/v2@latest
    - go-md2man -in man/directoryGrouperBySize.md -out man/directoryGrouperBySize.1
builds:
  -
    id: "directoryGrouperBySize"
    binary: "directoryGrouperBySize"
    dir: cmd/directoryGrouperBySize
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm
      - arm64
    goarm:
      - 6
      - 7
archives:
  -
    format_overrides:
      - goos: windows
        format: zip
    files:
      - man/directoryGrouperBySize.1
checksum:
  name_template: 'checksums.txt'
snapshot:
  name_template: "{{ .Tag }}-next"
changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
nfpms:
  -
    vendor: Ubels Software Development
    homepage: https://github.com/arran4/
    maintainer: Arran Ubels <arran@ubels.com.au>
    description: NA
    license: MIT
    formats:
      - apk
      - deb
      - rpm
    release: 1
    section: default
    priority: extra
    contents:
      - src: man/directoryGrouperBySize.1
        dst: /usr/share/man/man1/directoryGrouperBySize.1
